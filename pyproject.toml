[project]
name = "tuipasswordmanager"
version = "0.1.0"
description = "A simple terminal-based password manager with an encrypted local vault."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyperclip>=1.8.2",
  "cryptography>=41.0.0"
]

[project.scripts]
tuipasswordmanager = "passwordmanager:main"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
